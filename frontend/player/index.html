<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>屏幕播放器</title>
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://vjs.zencdn.net/8.10.0/video-js.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #000;
        color: #fff;
        justify-content: center;
        align-items: center;
      }
      #player-container {
        width: 90vw;
        height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #image-display {
        max-width: 100%;
        max-height: 100%;
        border-radius: 12px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.6);
        display: none;
      }
      #video-player {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
      }
      #status-bar {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        right: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.75rem;
        background: rgba(15, 23, 42, 0.65);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #status-bar span {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="player-container">
      <video
        id="video-player"
        class="video-js vjs-theme-city"
        controls
        preload="auto"
        playsinline
      ></video>
      <img id="image-display" alt="静态素材" />
      <div id="status-bar">
        <div>
          <strong id="screen-label">未连接</strong>
          <span id="playlist-label"></span>
        </div>
        <span id="status-message">等待指令...</span>
      </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const screenId = params.get("screen") || prompt("请输入屏幕 ID:");
      if (!screenId) {
        alert("必须指定屏幕 ID");
        throw new Error("Screen id is required");
      }

      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const host = window.location.host;
      const apiBase = window.location.origin.replace(/\/$/, "");
      const wsUrl = `${protocol}://${host}/screens/ws/${screenId}`;

      const videoPlayer = videojs("video-player", {
        autoplay: true,
        controls: false,
        loop: false,
        muted: true,
        preload: "auto",
      });

      const imageDisplay = document.getElementById("image-display");
      const statusMessage = document.getElementById("status-message");
      const playlistLabel = document.getElementById("playlist-label");
      const screenLabel = document.getElementById("screen-label");

      let currentPlaylistId = null;
      let currentItems = [];
      let currentIndex = 0;
      let loopMode = "sequential";
      let loopTimer = null;

      screenLabel.textContent = `屏幕 #${screenId}`;

      function clearTimer() {
        if (loopTimer) {
          clearTimeout(loopTimer);
          loopTimer = null;
        }
      }

      async function fetchJSON(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return await response.json();
      }

      async function loadPlaylist(playlistId) {
        if (!playlistId) {
          statusMessage.textContent = "未分配播放列表";
          videoPlayer.pause();
          videoPlayer.poster("https://dummyimage.com/1280x720/0f172a/1e293b&text=等待指令");
          imageDisplay.style.display = "none";
          return;
        }
        try {
          const playlist = await fetchJSON(`${apiBase}/playlists/${playlistId}`);
          currentPlaylistId = playlist.id;
          currentItems = playlist.items.sort((a, b) => a.order_index - b.order_index);
          loopMode = playlist.playback_mode;
          playlistLabel.textContent = ` · 播放列表 #${playlist.id} (${playlist.playback_mode})`;
          statusMessage.textContent = "加载素材中";
          currentIndex = 0;
          playCurrentItem();
        } catch (error) {
          statusMessage.textContent = `加载失败: ${error.message}`;
        }
      }

      function scheduleNext(duration) {
        clearTimer();
        loopTimer = setTimeout(() => {
          advanceItem();
          playCurrentItem();
        }, duration * 1000);
      }

      function advanceItem() {
        if (loopMode === "loop_single") {
          return;
        }
        currentIndex += 1;
        if (currentIndex >= currentItems.length) {
          currentIndex = loopMode === "loop_list" ? 0 : currentItems.length - 1;
        }
      }

      function applyCropSettings(crop) {
        if (!crop) {
          videoPlayer.fill(true);
          imageDisplay.style.objectFit = "cover";
          return;
        }
        const { width, height } = crop;
        imageDisplay.style.objectFit = "cover";
        const container = document.getElementById("player-container");
        container.style.aspectRatio = `${width} / ${height}`;
      }

      function playCurrentItem() {
        clearTimer();
        if (!currentItems.length) {
          statusMessage.textContent = "播放列表为空";
          videoPlayer.pause();
          return;
        }
        const item = currentItems[currentIndex];
        const asset = item.asset;
        applyCropSettings(item.crop_settings || asset.metadata?.crop_settings);
        const duration = item.display_duration_seconds || asset.duration_seconds || 30;
        if (asset.asset_type === "image") {
          imageDisplay.src = asset.source_uri;
          imageDisplay.style.display = "block";
          videoPlayer.pause();
          videoPlayer.currentTime(0);
          videoPlayer.poster(asset.source_uri);
          statusMessage.textContent = `显示图片：${asset.name}`;
          scheduleNext(duration);
        } else {
          imageDisplay.style.display = "none";
          videoPlayer.src({
            src: asset.source_uri,
            type: asset.asset_type === "stream" ? "application/x-mpegURL" : "video/mp4",
          });
          videoPlayer.play();
          statusMessage.textContent = `播放视频：${asset.name}`;
          if (asset.asset_type !== "stream") {
            scheduleNext(duration);
          }
        }
      }

      videoPlayer.on("ended", () => {
        if (loopMode === "loop_single") {
          videoPlayer.play();
          return;
        }
        advanceItem();
        playCurrentItem();
      });

      const socket = new WebSocket(wsUrl);
      socket.addEventListener("open", () => {
        statusMessage.textContent = "已连接后台";
      });
      socket.addEventListener("close", () => {
        statusMessage.textContent = "连接已断开，10秒后重试";
        setTimeout(() => window.location.reload(), 10000);
      });
      socket.addEventListener("message", async (event) => {
        const data = JSON.parse(event.data);
        if (data.event === "connected") {
          statusMessage.textContent = "等待指令";
          if (data.assigned_playlist_id) {
            await loadPlaylist(data.assigned_playlist_id);
          }
        }
        if (data.event === "playlist_assigned") {
          await loadPlaylist(data.playlist_id);
        }
        if (data.event === "reload") {
          window.location.reload();
        }
        if (data.event === "set_volume" && typeof data.payload?.volume === "number") {
          videoPlayer.volume(Math.min(Math.max(data.payload.volume / 100, 0), 1));
        }
      });
    </script>
  </body>
</html>
